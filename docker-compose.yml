name: manticore-stack

# Every service is profile-gated and has no hard dependency on another.
# Start only what you need; connectors degrade if a peer is absent.
#
#   docker compose --profile sentinel up -d
#   docker compose --profile peerweave --profile evrus up -d
#   docker compose --profile stack up -d
#
# Profiles: sentinel, peerweave, evrus, observe, stack

services:
  sentinel:
    profiles: ["sentinel", "stack"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/sentinel/Dockerfile
    pid: host
    environment:
      MANTICORE_PROFILE: stack
      MANTICORE_REFRESH_MS: ${MANTICORE_REFRESH_MS:-1000}
      MANTICORE_STORE_ENABLED: "true"
      MANTICORE_STORE_PATH: /var/lib/manticore/sentinel.sqlite
      MANTICORE_SEARCH_ENABLED: "true"
      MANTICORE_OBS_HTTP_ENABLED: "true"
      MANTICORE_OBS_HTTP_PORT: "9463"
      MANTICORE_EVENT_STREAM_ENABLED: "true"
      MANTICORE_EVENT_STREAM_PORT: "9462"
      MANTICORE_PEERWEAVE_ENABLED: ${MANTICORE_PEERWEAVE_ENABLED:-true}
      MANTICORE_PEERWEAVE_GRAPHQL_URL: ${MANTICORE_PEERWEAVE_GRAPHQL_URL:-http://peerweave:3200/graphql}
      MANTICORE_PEERWEAVE_CAP_TOKEN: ${MANTICORE_PEERWEAVE_CAP_TOKEN:-}
      MANTICORE_PEERWEAVE_PUBLISH_ENABLED: ${MANTICORE_PEERWEAVE_PUBLISH_ENABLED:-true}
      MANTICORE_PEERWEAVE_PUBLISH_SPACE_ID: ${MANTICORE_PEERWEAVE_PUBLISH_SPACE_ID:-sentinel-space}
      MANTICORE_EVRUS_ENABLED: ${MANTICORE_EVRUS_ENABLED:-true}
      MANTICORE_EVRUS_OIDC_URL: ${MANTICORE_EVRUS_OIDC_URL:-http://evrus-oidc:8790}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - sentinel-data:/var/lib/manticore
    ports:
      - "9462:9462"
      - "9463:9463"
    healthcheck:
      test: ["CMD", "manticore-sentinel", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 20s

  peerweave:
    profiles: ["peerweave", "stack"]
    restart: unless-stopped
    build:
      context: ./docker/peerweave-graphql
    environment:
      PORT: "3200"
      PW_GRAPHQL_TOKEN: ${MANTICORE_PEERWEAVE_CAP_TOKEN:-}
      PW_SPACE_ID: ${MANTICORE_PEERWEAVE_PUBLISH_SPACE_ID:-sentinel-space}
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3200/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  evrus-oidc:
    profiles: ["evrus", "stack"]
    restart: unless-stopped
    build:
      context: ./docker/evrus-oidc
    environment:
      PORT: "8790"
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://evrus-oidc:8790}
      EVRUS_SIOP_ISS: ${EVRUS_SIOP_ISS:-did:key:z6MkDemo}
    ports:
      - "8790:8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  observe:
    profiles: ["observe", "stack"]
    restart: unless-stopped
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import http.server, os
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                dest = os.environ.get("SENTINEL_OBS_URL", "http://sentinel:9463/").rstrip("/") + self.path
                self.send_response(302)
                self.send_header("Location", dest)
                self.end_headers()
            def log_message(self, *args):
                return
        http.server.ThreadingHTTPServer(("0.0.0.0", 8088), H).serve_forever()
    environment:
      SENTINEL_OBS_URL: http://sentinel:9463
    ports:
      - "8088:8088"

volumes:
  sentinel-data:
